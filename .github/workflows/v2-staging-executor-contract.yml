name: V2 staging executor credential-free contract
on:
  push:
    branches: ['codex/v2-neon-staging-bootstrap']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --test lib/staging-bootstrap-policy.test.ts
      - run: ./node_modules/.bin/eslint scripts/staging/*.mjs lib/staging-bootstrap-policy.test.ts
      - run: git show --format= --check HEAD
