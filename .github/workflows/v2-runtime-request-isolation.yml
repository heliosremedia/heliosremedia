name: V2 isolated runtime request isolation
on:
  push:
    branches: ['codex/v2-runtime-request-isolation', 'codex/v2-runtime-portfolio-isolation', 'codex/v2-preview-write-fencing', 'codex/v2-webhook-message-isolation', 'codex/v2-webhook-stored-ownership', 'codex/v2-webhook-payload-boundary', 'codex/v2-webhook-retry-identity', 'codex/v2-webhook-admission-failure', 'codex/v2-webhook-retry-admission', 'codex/v2-webhook-completion-boundary', 'codex/v2-preference-group-atomicity', 'codex/v2-complaint-settlement-atomicity', 'codex/v2-bounce-audit-atomicity', 'codex/v2-social-ai-runtime', 'codex/v2-social-ai-rollback', 'codex/v2-social-ai-provider-failure', 'codex/v2-social-ai-request-scope', 'codex/v2-consent-admin-containment', 'codex/v2-consent-schema-expand', 'codex/v2-consent-scoped-adapters', 'codex/v2-consent-workspace-tokens', 'codex/v2-consent-delivery-readers', 'codex/v2-consent-public-unsubscribe', 'codex/v2-consent-directory-projection', 'codex/v2-consent-admin-activation', 'codex/v2-campaign-consent-tokens', 'codex/v2-newsletter-consent-tokens', 'codex/v2-consent-analytics-attribution', 'codex/v2-referral-preparation-fencing', 'codex/v2-referral-consent-tokens', 'codex/v2-monitor-context-containment', 'codex/v2-brand-upload-admission', 'codex/v2-email-upload-ownership', 'codex/v2-project-image-upload-admission', 'codex/v2-series-calendar-isolation', 'codex/v2-storage-diagnostic-containment', 'codex/v2-stream-upload-admission', 'codex/v2-stream-metadata-authority', 'codex/v2-project-image-attachment-ownership', 'codex/v2-project-image-attachment-fencing', 'codex/v2-stream-attachment-fencing', 'codex/v2-external-media-creation-fencing', 'codex/v2-media-update-asset-fencing', 'codex/v2-media-collection-fencing', 'codex/v2-media-presentation-fencing', 'codex/v2-media-delete-fencing', 'codex/v2-testimonial-status-fencing', 'codex/v2-testimonial-reorder-fencing', 'codex/v2-testimonial-delete-fencing', 'codex/v2-testimonial-write-fencing', 'codex/v2-trusted-logo-fencing', 'codex/v2-photo-comparison-fencing', 'codex/v2-team-member-fencing', 'codex/v2-about-page-fencing', 'codex/v2-support-diagnostics-foundation', 'codex/v2-featured-film-attachment-fencing', 'codex/v2-settings-attachment-fencing', 'codex/v2-workspace-lifecycle-foundation', 'codex/v2-workspace-lifecycle-admission', 'codex/v2-workspace-lifecycle-public', 'codex/v2-workspace-invitation-fencing', 'codex/v2-profile-write-fencing', 'codex/v2-newsletter-reactivation-admission', 'codex/v2-command-center', 'codex/v2-schedule-review', 'codex/v2-approval-deadline-admission', 'codex/v2-newsletter-schedule-editor', 'codex/v2-studio-job-review', 'codex/v2-studio-project-media', 'codex/v2-studio-project-editor', 'codex/v2-studio-project-create', 'codex/v2-studio-media-editor', 'codex/v2-project-setup-navigation']
permissions:
  contents: read
concurrency:
  group: runtime-request-isolation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: helios_rehearsal
          POSTGRES_PASSWORD: synthetic_only
          POSTGRES_DB: helios_packet19
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U helios_rehearsal -d helios_packet19"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PACKET19_DATABASE_URL: postgresql://helios_rehearsal:synthetic_only@127.0.0.1:55439/helios_packet19
      DIRECT_URL: postgresql://helios_rehearsal:synthetic_only@127.0.0.1:55439/helios_packet19
      DATABASE_URL: postgresql://helios_rehearsal:synthetic_only@127.0.0.1:55439/helios_packet19
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: ./node_modules/.bin/prisma generate
      - name: Qualify real Next production server against disposable PostgreSQL
        run: node scripts/rehearsal/request-isolation/run.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: request-isolation-${{ github.sha }}
          path: release-evidence/request-isolation.json
          if-no-files-found: error
